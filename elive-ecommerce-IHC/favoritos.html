<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis favoritos | ELIVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9F9F6] text-black font-sans antialiased">

  <a href="#contenido" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:border focus:border-black focus:bg-white focus:px-4 focus:py-2">Saltar al contenido</a>

  <header id="site-header"></header>

  <main id="contenido" class="mx-auto max-w-7xl px-4 py-8 lg:px-8 lg:py-12">
    <div class="mb-8 flex flex-wrap items-baseline gap-x-3">
      <h1 id="h1" tabindex="-1" class="text-3xl font-semibold uppercase tracking-tight lg:text-4xl">Mis favoritos</h1>
      <p id="conteo" class="text-base" aria-live="polite"></p>
    </div>
    <p id="tip" class="mb-6 hidden text-sm">Toca el corazón de una prenda para quitarla de tus favoritos. Si te equivocas, puedes deshacerlo.</p>

    <ul id="favs" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></ul>

    <div id="vacio" class="hidden bg-white p-8 text-center shadow-[0_1px_2px_rgba(0,0,0,0.06)]">
      <svg class="mx-auto h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
      <h2 class="mt-3 text-xl font-semibold">Aún no tienes favoritos</h2>
      <p class="mt-2">Toca el corazón de una prenda para guardarla aquí.</p>
      <a href="index.html#catalogo" class="mt-6 inline-block border border-black bg-white px-8 py-3 text-sm tracking-wide transition-colors hover:bg-black hover:text-white">Ver catálogo</a>
    </div>

    <p id="seguir" class="mt-10 hidden"><a href="index.html#catalogo" class="text-sm underline underline-offset-4">‹ Seguir comprando</a></p>
  </main>

  <footer></footer>

  <script src="elive.js?v=20261007-validation"></script>
  <script>
    mountHeader();

    function render() {
      const items = Fav.list().map(prod).filter(Boolean);
      $('#conteo').textContent = `(${items.length} ${items.length === 1 ? 'prenda' : 'prendas'})`;
      $('#favs').innerHTML = items.map(card).join('');
      $('#vacio').classList.toggle('hidden', items.length > 0);
      $('#tip').classList.toggle('hidden', !items.length);
      $('#seguir').classList.toggle('hidden', !items.length);
      // Si la prenda quitada tenía el foco, lo devolvemos al título
      if (document.activeElement === document.body) $('#h1').focus();
    }
    document.addEventListener('elive:change', render);
    render();
  </script>
</body>
</html>
